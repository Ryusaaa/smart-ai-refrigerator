<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">SMART AI Refrigerator</title>
  <desc id="bd">AI Recipe and Ingredient Assistant. Prototype software layer, Design Thinking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050d"/><stop offset="1" stop-color="#071633"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b6c6e0"/>
    </linearGradient>
    <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e63ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#4fd1ff"/>
      <stop offset="1" stop-color="#1e63ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b6" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="cl"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .rise { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; }
    .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    .blob { animation: drift 14s ease-in-out infinite alternate; }
    .blob2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(-40px, 10px); } to { transform: translate(50px, -20px); } }
    .flow { stroke-dasharray: 520 380; animation: flow 9s linear infinite; }
    .flow2 { stroke-dasharray: 300 500; animation: flow 13s linear infinite reverse; }
    @keyframes flow { to { stroke-dashoffset: -900; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
    .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pt { fill: #8ab8f5; opacity: 0; animation: up linear infinite; }
    @keyframes up { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-400px); opacity: 0; } }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#cl)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <ellipse class="blob" cx="900" cy="200" rx="300" ry="130" fill="#1e63ff" opacity=".38" filter="url(#b40)"/>
    <ellipse class="blob2" cx="520" cy="330" rx="260" ry="90" fill="#0ea5e9" opacity=".22" filter="url(#b40)"/>

    <g fill="none" stroke="url(#wv)" stroke-linecap="round">
      <path class="flow" d="M-60 300 C 180 170, 380 400, 640 250 S 1000 90, 1280 230" stroke-width="16" opacity=".22" filter="url(#b6)"/>
      <path class="flow" d="M-60 300 C 180 170, 380 400, 640 250 S 1000 90, 1280 230" stroke-width="3"/>
      <path class="flow2" d="M-60 340 C 220 250, 460 120, 720 210 S 1050 330, 1280 150" stroke-width="2" opacity=".7"/>
    </g>

    <g transform="translate(985 190)">
      <circle class="spin-r" r="118" fill="none" stroke="#2f6bff" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 12"/>
      <circle r="84" fill="#061230" fill-opacity=".55" stroke="#1e63ff" stroke-opacity=".45"/>
      <g class="spin glow" stroke="#9cc4ff" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="-0.0" y1="-62.0" x2="0.0" y2="62.0"/>
      <line x1="0.0" y1="38.4" x2="-9.2" y2="51.6"/>
      <line x1="0.0" y1="38.4" x2="9.2" y2="51.6"/>
      <line x1="-0.0" y1="-38.4" x2="9.2" y2="-51.6"/>
      <line x1="-0.0" y1="-38.4" x2="-9.2" y2="-51.6"/>
      <line x1="53.7" y1="-31.0" x2="-53.7" y2="31.0"/>
      <line x1="-33.3" y1="19.2" x2="-49.3" y2="17.8"/>
      <line x1="-33.3" y1="19.2" x2="-40.1" y2="33.8"/>
      <line x1="33.3" y1="-19.2" x2="49.3" y2="-17.8"/>
      <line x1="33.3" y1="-19.2" x2="40.1" y2="-33.8"/>
      <line x1="53.7" y1="31.0" x2="-53.7" y2="-31.0"/>
      <line x1="-33.3" y1="-19.2" x2="-40.1" y2="-33.8"/>
      <line x1="-33.3" y1="-19.2" x2="-49.3" y2="-17.8"/>
      <line x1="33.3" y1="19.2" x2="40.1" y2="33.8"/>
      <line x1="33.3" y1="19.2" x2="49.3" y2="17.8"/>
      </g>
    </g>

    <g><circle class="pt" cx="703" cy="380" r="2.2" style="animation-duration:9.8s;animation-delay:-0.4s"/><circle class="pt" cx="1137" cy="380" r="1.6" style="animation-duration:9.6s;animation-delay:-0.5s"/><circle class="pt" cx="1079" cy="380" r="2.2" style="animation-duration:7.3s;animation-delay:-3.9s"/><circle class="pt" cx="183" cy="380" r="2.2" style="animation-duration:7.6s;animation-delay:-3.8s"/><circle class="pt" cx="293" cy="380" r="2.2" style="animation-duration:11.4s;animation-delay:-5.2s"/><circle class="pt" cx="166" cy="380" r="3.6" style="animation-duration:7.3s;animation-delay:-2.0s"/><circle class="pt" cx="312" cy="380" r="3" style="animation-duration:9.9s;animation-delay:-4.9s"/><circle class="pt" cx="671" cy="380" r="2.2" style="animation-duration:7.7s;animation-delay:-5.1s"/><circle class="pt" cx="424" cy="380" r="3" style="animation-duration:7.7s;animation-delay:-6.4s"/><circle class="pt" cx="162" cy="380" r="2.2" style="animation-duration:10.5s;animation-delay:-4.8s"/><circle class="pt" cx="683" cy="380" r="3.6" style="animation-duration:11.1s;animation-delay:-4.1s"/><circle class="pt" cx="653" cy="380" r="2.2" style="animation-duration:12.6s;animation-delay:-6.3s"/><circle class="pt" cx="539" cy="380" r="1.6" style="animation-duration:11.0s;animation-delay:-4.7s"/><circle class="pt" cx="743" cy="380" r="3.6" style="animation-duration:9.0s;animation-delay:-8.8s"/><circle class="pt" cx="281" cy="380" r="3.6" style="animation-duration:8.2s;animation-delay:-3.1s"/><circle class="pt" cx="1041" cy="380" r="3.6" style="animation-duration:7.3s;animation-delay:-6.0s"/></g>

    <g fill="#ffffff">
      <text class="rise d1" x="70" y="132" font-size="78" font-weight="800" letter-spacing="1" fill="url(#ttl)">SMART AI</text>
      <text class="rise d2" x="70" y="212" font-size="78" font-weight="800" letter-spacing="1" fill="url(#ttl)">Refrigerator</text>
    </g>
    <text class="rise d3" x="72" y="264" font-size="26" font-weight="500" fill="#8ab8f5">AI Recipe &amp; Ingredient Assistant</text>

    <g class="rise d4" font-size="15" font-weight="600" text-anchor="middle">
      <rect x="70" y="300" width="130" height="38" rx="19" fill="#0b3d91" stroke="#ffffff" stroke-width="1.6"/>
      <text x="135" y="324" fill="#ffffff">Prototype</text>
      <rect x="212" y="300" width="164" height="38" rx="19" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <text x="294" y="324" fill="#8ab8f5">Software Layer</text>
      <rect x="388" y="300" width="176" height="38" rx="19" fill="none" stroke="#ffffff" stroke-width="1.6"/>
      <text x="476" y="324" fill="#8ab8f5">Design Thinking</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#1e63ff" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
