    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 10s ease-out infinite; }
    @keyframes ring { 0% { opacity: .95; transform: scale(1); } 7% { opacity: 0; transform: scale(1.7); } 100% { opacity: 0; transform: scale(1.7); } }
    @media (prefers-reduced-motion: reduce) { .dash, .ring { animation: none; } }
  </style>
