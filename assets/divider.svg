<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e63ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4fd1ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1e63ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab8f5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ab8f5" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect x="0" y="4" width="1200" height="2" rx="1" fill="url(#base)"/>
  <rect y="3" width="260" height="4" rx="2" fill="url(#hl)" filter="url(#g)">
    <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect y="4" width="260" height="2" rx="1" fill="url(#hl)">
    <animate attributeName="x" from="-260" to="1200" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
